<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Ticketing System - Pro Version</title>
    
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root { --bus-blue: #1e88e5; --dark-blue: #1565c0; --light-blue: #e3f2fd; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--light-blue); margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 500px; margin-bottom: 15px; }
        h2, h3 { color: var(--dark-blue); margin-top: 0; }
        #reader { width: 100%; border-radius: 8px; border: 2px solid var(--bus-blue); }
        .info-box { display: none; padding: 15px; background: #fffde7; border: 2px solid #fbc02d; border-radius: 8px; margin-top: 15px; }
        .price-tag { font-size: 1.5em; color: #d32f2f; font-weight: bold; }
        #ticketResult { display: none; text-align: center; border: 2px dashed #4caf50; padding: 15px; margin-top: 15px; background: #f1f8e9; }
        #qrcode { display: inline-block; margin: 10px 0; }
        .btn { padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 8px; }
        .btn-blue { background: var(--bus-blue); color: white; }
        .btn-green { background: #4caf50; color: white; }
        .btn-pdf { background: #e74c3c; color: white; margin-top: 15px; }
        .stats-area { background: var(--dark-blue); color: white; }
        .editable { border-bottom: 1px dashed white; cursor: pointer; color: #ffeb3b; }
    </style>
</head>
<body>

<div class="card">
    <h2>🚌 BUS TICKETING STATION</h2>
    <div id="reader"></div>
    
    <div id="passengerInfo" class="info-box">
        <h3>PASSENGER INFO</h3>
        <p><strong>Name:</strong> <span id="resName"></span></p>
        <p><strong>Ticket Type:</strong> <span id="resType"></span></p>
        <div class="price-tag" id="resPrice"></div>
        <button class="btn btn-green" onclick="confirmAndPrint()">CONFIRM & PRINT QR TICKET</button>
        <button class="btn" style="background:#ccc" onclick="resetAll()">CANCEL</button>
    </div>

    <div id="ticketResult">
        <h3 style="color:#2e7d32">VALID BUS TICKET</h3>
        <div id="qrcode"></div>
        <p id="ticketDetails" style="font-size: 0.9em; font-weight: bold;"></p>
        <button class="btn btn-blue" onclick="resetAll()">SCAN NEXT</button>
    </div>
</div>

<div class="card stats-area">
    <h3>SHIFT MANAGEMENT</h3>
    <p>Staff Name: <span id="staffName" class="editable" onclick="editInfo('staffName')">Nguyen Van A</span></p>
    <p>Shift Start: <span id="startTime" class="editable" onclick="editInfo('startTime')">06:00 AM</span></p>
    <hr>
    <div style="display: flex; justify-content: space-between;">
        <span>Total Passengers: <strong id="totalPax">0</strong></span>
        <span>Total Revenue: <strong id="totalRev">0</strong> VND</span>
    </div>
    <button class="btn btn-pdf" onclick="exportPDF()">EXPORT PDF REPORT 📄</button>
</div>

<script>
    let stats = { pax: 0, revenue: 0 };
    let currentData = null;
    const { jsPDF } = window.jspdf;

    const html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, onScanSuccess);

    function onScanSuccess(decodedText) {
        html5QrCode.pause();
        const parts = decodedText.split('|');
        if (parts.length < 6) {
            alert("Invalid QR Format!");
            html5QrCode.resume();
            return;
        }

        const name = parts[2];
        const birthYear = parseInt(parts[3].substring(4, 8));
        const age = 2026 - birthYear;

        let type = "Standard", price = 6000;
        if (age >= 1 && age <= 14) { type = "Children"; price = 0; }
        else if (age >= 15 && age <= 28) { type = "Student"; price = 3000; }
        else if (age >= 50) { type = "Senior"; price = 0; }

        currentData = { name, type, price, time: new Date().toLocaleTimeString() };

        document.getElementById('resName').innerText = name;
        document.getElementById('resType').innerText = type;
        document.getElementById('resPrice').innerText = price.toLocaleString() + " VND";
        document.getElementById('passengerInfo').style.display = 'block';
    }

    function confirmAndPrint() {
        stats.pax++;
        stats.revenue += currentData.price;
        document.getElementById('totalPax').innerText = stats.pax;
        document.getElementById('totalRev').innerText = stats.revenue.toLocaleString();

        document.getElementById('qrcode').innerHTML = "";
        const qrContent = `BUS-TICKET|${currentData.name}|${currentData.type}|${currentData.price}|${currentData.time}`;
        new QRCode(document.getElementById("qrcode"), { text: qrContent, width: 150, height: 150 });

        document.getElementById('ticketDetails').innerText = `${currentData.type} - ${currentData.time}`;
        document.getElementById('passengerInfo').style.display = 'none';
        document.getElementById('ticketResult').style.display = 'block';
    }

    // HÀM XUẤT PDF BẰNG TIẾNG ANH ĐỂ TRÁNH LỖI FONT
    function exportPDF() {
        const doc = new jsPDF();
        const staff = document.getElementById('staffName').innerText;
        const start = document.getElementById('startTime').innerText;
        const date = new Date().toLocaleDateString('en-GB');

        // Header
        doc.setFont("helvetica", "bold");
        doc.setFontSize(22);
        doc.setTextColor(30, 136, 229); // Màu xanh Bus Blue
        doc.text("BUS REVENUE REPORT", 105, 30, { align: 'center' });

        // Content
        doc.setFont("helvetica", "normal");
        doc.setFontSize(12);
        doc.setTextColor(0, 0, 0);
        
        let yPos = 50;
        doc.text(`Report Date: ${date}`, 20, yPos);
        doc.text(`Staff Name: ${staff}`, 20, yPos + 10);
        doc.text(`Shift Started At: ${start}`, 20, yPos + 20);
        
        doc.setLineWidth(0.5);
        doc.line(20, yPos + 30, 190, yPos + 30); // Dấu gạch ngang

        doc.setFont("helvetica", "bold");
        doc.text("SUMMARY STATISTICS", 20, yPos + 45);
        
        doc.setFont("helvetica", "normal");
        doc.text(`- Total Passengers Served: ${stats.pax}`, 30, yPos + 55);
        doc.text(`- Total Revenue Collected: ${stats.revenue.toLocaleString()} VND`, 30, yPos + 65);

        doc.setFontSize(10);
        doc.setFont("helvetica", "italic");
        doc.text("This is an automatically generated report from the Smart Bus System.", 105, 120, { align: 'center' });

        // Save file
        doc.save(`Revenue_Report_${staff.replace(/\s+/g, '_')}.pdf`);
    }

    function editInfo(id) {
        let val = prompt("Enter new information (Please use English or No-Accents):", document.getElementById(id).innerText);
        if (val) document.getElementById(id).innerText = val;
    }

    function resetAll() {
        document.getElementById('passengerInfo').style.display = 'none';
        document.getElementById('ticketResult').style.display = 'none';
        currentData = null;
        if (html5QrCode.getState() === 3) html5QrCode.resume();
    }
</script>

</body>
</html>
