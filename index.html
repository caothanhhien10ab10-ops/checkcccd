<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống bán vé giao thông công cộng - Pro v2.1</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        /* Giao diện chung */
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #eef2f3; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 600px; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        
        /* --- BRANDING HEADER (Main App UI) --- */
        .brand-header { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #edf2f7; }
        .brand-logo { width: 60px; height: auto; object-fit: contain; }
        .brand-name { font-size: 1.2rem; font-weight: 800; color: #2c5282; text-transform: uppercase; letter-spacing: 0.5px; }
        
        h1 { color: #1a365d; text-align: center; font-size: 1.4rem; margin-top: 0; margin-bottom: 20px; }
        
        /* Bộ đếm vé */
        .dashboard { display: flex; justify-content: space-around; background: #2d3748; color: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .stat-item { text-align: center; }
        .stat-value { font-size: 1.4rem; font-weight: bold; color: #63b3ed; }

        /* Camera */
        #reader { width: 100%; border-radius: 10px; overflow: hidden; border: 2px dashed #cbd5e0; }

        /* Kết quả & Vé */
        #result-area { display: none; margin-top: 20px; }
        .ticket-box { border: 2px solid #2d3748; padding: 20px; border-radius: 8px; background: #fff; position: relative; }
        
        /* --- TICKET BRANDING (Inside Ticket for Printing) --- */
        .ticket-brand-print { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 12px; 
            margin-bottom: 15px; 
            padding-bottom: 10px; 
            border-bottom: 1px solid #e2e8f0; 
        }
        .ticket-logo-print { width: 45px; height: auto; object-fit: contain; }
        .ticket-co-name-print { font-size: 1.05rem; font-weight: 800; color: #2c5282; text-transform: uppercase; }

        .ticket-header { border-bottom: 2px dashed #cbd5e0; padding-bottom: 10px; margin-bottom: 15px; text-align: center; }
        
        /* Thông tin hành khách - Cập nhật cho Address */
        .info-line { display: flex; flex-direction: column; margin-bottom: 10px; font-size: 0.95rem; }
        .info-line .label { color: #718096; font-weight: 500; margin-bottom: 2px;}
        .info-line .value { font-weight: 600; color: #1a202c; word-break: break-word; } /* Word break cho Address dài */

        /* Kiểu cũ cho các dòng ngắn (Name, ID, DOB, DOI) - Tùy chọn nếu muốn tiết kiệm không gian */
        .info-line.short { flex-direction: row; justify-content: space-between; align-items: center; }
        .info-line.short .label { margin-bottom: 0; }

        /* Phân loại vé */
        .status-badge { text-align: center; padding: 10px; border-radius: 5px; font-weight: bold; margin-top: 15px; }
        .free { background: #c6f6d5; color: #22543d; }
        .student { background: #bee3f8; color: #2a4365; }
        .normal { background: #feebc8; color: #744210; }

        /* Nút bấm */
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-print { background: #3182ce; color: white; }
        .btn-next { background: #718096; color: white; }
        button:hover { opacity: 0.9; }

        /* --- FOOTER SIGNATURE --- */
        .signature { margin-top: 30px; text-align: center; font-size: 0.85rem; color: #a0aec0; font-weight: 500; }
        .signature b { color: #4a5568; }

        /* Cấu hình in */
        @media print {
            body * { visibility: hidden; }
            #ticket-to-print, #ticket-to-print * { visibility: visible; }
            #ticket-to-print { position: absolute; left: 0; top: 0; width: 100%; border: none; }
            .btn-group, .brand-header, .signature { display: none; }
            
            /* Tùy chỉnh màu in cho logo và tên công ty trên vé */
            .ticket-co-name-print { color: black !important; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="brand-header">
            <img src="https://upload.wikimedia.org/wikipedia/commons/3/38/Logo_UIT_updated.jpg" alt="Logo UIT" class="brand-logo">
            <div class="brand-name">Công Ty TNHH Vận tải UIT</div>
        </div>

        <h1>Hệ thống bán vé công cộng</h1>

        <div class="dashboard">
            <div class="stat-item">
                <div>Tổng vé hôm nay</div>
                <div id="total-tickets" class="stat-value">0</div>
            </div>
            <div class="stat-item">
                <div>Doanh thu ($)</div>
                <div id="total-revenue" class="stat-value">0</div>
            </div>
        </div>

        <div id="reader"></div>

        <div id="result-area">
            <div id="ticket-to-print" class="ticket-box">
                
                <div class="ticket-brand-print">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/3/38/Logo_UIT_updated.jpg" alt="Logo UIT Print" class="ticket-logo-print">
                    <div class="ticket-co-name-print">CÔNG TY TNHH VẬN TẢI UIT</div>
                </div>

                <div class="ticket-header">
                    <strong style="font-size: 1.2rem;">VÉ XE BUÝT KỸ THUẬT SỐ</strong>
                    <div id="print-time" style="font-size: 0.8rem; color: #a0aec0;"></div>
                </div>
                
                <div class="info-line short"><span class="label">Hành khách:</span> <span id="res-name" class="value"></span></div>
                <div class="info-line short"><span class="label">Số CCCD:</span> <span id="res-id" class="value"></span></div>
                <div class="info-line short"><span class="label">Ngày sinh:</span> <span id="res-dob" class="value"></span></div>
                <div class="info-line short"><span class="label">Ngày cấp:</span> <span id="res-doi" class="value"></span></div>
                
                <div class="info-line">
                    <span class="label">Địa chỉ (Address):</span>
                    <span id="res-address" class="value"></span>
                </div>
                
                <div id="ticket-type" class="status-badge"></div>
            </div>

            <div class="btn-group">
                <button class="btn-print" onclick="window.print()">In vé cho khách</button>
                <button class="btn-next" onclick="resetScanner()">Quét vé tiếp theo</button>
            </div>
        </div>

        <div class="signature">
            &lt;/&gt; Phát triển bởi <b>CaoThanhHIen x GeminiAI</b> &lt;/&gt;
        </div>
    </div>

    <script>
        const html5QrCode = new Html5Qrcode("reader");
        const config = { fps: 10, qrbox: { width: 250, height: 250 } };

        let stats = JSON.parse(localStorage.getItem('bus_stats')) || { date: new Date().toLocaleDateString(), count: 0, revenue: 0 };
        
        if (stats.date !== new Date().toLocaleDateString()) {
            stats = { date: new Date().toLocaleDateString(), count: 0, revenue: 0 };
        }
        updateDashboard();

        function onScanSuccess(decodedText) {
            html5QrCode.stop();
            const parts = decodedText.split('|');
            
            if (parts.length < 7) {
                alert("Mã QR không hợp lệ!");
                resetScanner();
                return;
            }

            // Trích xuất dữ liệu cơ bản
            const data = {
                id: parts[0],
                name: parts[2],
                dob: parts[3],
                doi: parts[6],
                // GHI CHÚ KỸ THUẬT: Địa chỉ không có sẵn trong các parts[] cơ bản.
                // Mặc định đặt giá trị N/A.
                address: "N/A - Hệ thống chưa hỗ trợ lấy địa chỉ từ QR cơ bản"
            };

            const birthYear = parseInt(data.dob.substring(4, 8));
            const age = new Date().getFullYear() - birthYear;

            let ticketInfo = { label: "", price: 0, class: "" };
            if (age >= 60) {
                ticketInfo = { label: "VÉ MIỄN CHO NGƯỜI GIÀ", price: 0, class: "free" };
            } else if (age >= 10 && age <= 29) {
                ticketInfo = { label: "VÉ HỌC SINH", price: 3, class: "student" };
            } else {
                ticketInfo = { label: "VÉ NGƯỜI LỚN", price: 10, class: "normal" };
            }

            // Hiển thị lên giao diện
            document.getElementById('res-name').innerText = data.name;
            document.getElementById('res-id').innerText = data.id;
            document.getElementById('res-dob').innerText = formatDate(data.dob);
            document.getElementById('res-doi').innerText = formatDate(data.doi);
            
            // CẬP NHẬT: Hiển thị Address
            document.getElementById('res-address').innerText = data.address;
            
            document.getElementById('print-time').innerText = "Ngày in: " + new Date().toLocaleString();
            
            const badge = document.getElementById('ticket-type');
            badge.innerText = `${ticketInfo.label} - Giá: ${ticketInfo.price}$`;
            badge.className = "status-badge " + ticketInfo.class;

            stats.count++;
            stats.revenue += ticketInfo.price;
            saveStats();

            document.getElementById('reader').style.display = 'none';
            document.getElementById('result-area').style.display = 'block';
        }

        function formatDate(str) {
            return str.replace(/(\d{2})(\d{2})(\d{4})/, "$1/$2/$3");
        }

        function updateDashboard() {
            document.getElementById('total-tickets').innerText = stats.count;
            document.getElementById('total-revenue').innerText = stats.revenue;
        }

        function saveStats() {
            localStorage.setItem('bus_stats', JSON.stringify(stats));
            updateDashboard();
        }

        function resetScanner() {
            document.getElementById('result-area').style.display = 'none';
            document.getElementById('reader').style.display = 'block';
            html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess);
        }

        html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess);
    </script>
</body>
</html>
