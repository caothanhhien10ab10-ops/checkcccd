<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Bán Vé Xe Buýt UIT</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --bus-blue: #1e88e5;
            --dark-blue: #1565c0;
            --light-blue: #e3f2fd;
        }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: var(--light-blue); margin: 0; padding: 10px; display: flex; flex-direction: column; gap: 15px; }
        
        .header { background: var(--dark-blue); color: white; padding: 15px; border-radius: 10px; text-align: center; }
        
        .main-layout { display: flex; gap: 15px; flex-wrap: wrap; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); flex: 1; min-width: 300px; }
        
        /* Khu vực Camera */
        #reader { width: 100%; border-radius: 8px; overflow: hidden; border: 2px solid var(--bus-blue); }
        
        /* Hiển thị thông tin */
        .info-box { display: none; margin-top: 15px; padding: 15px; background: #fffde7; border: 2px solid #fbc02d; border-radius: 8px; }
        .price-tag { font-size: 1.8em; color: #d32f2f; font-weight: bold; margin-top: 10px; }

        /* Nút bấm */
        .btn { padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; font-size: 1em; }
        .btn-print { background-color: var(--bus-blue); color: white; }
        .btn-manual { background-color: #4caf50; color: white; margin-bottom: 5px; }

        /* Thống kê ca */
        .stats-card { background: var(--dark-blue); color: white; padding: 20px; border-radius: 12px; width: 280px; }
        .editable { border-bottom: 1px dashed white; cursor: pointer; padding: 2px 5px; }
        .editable:hover { background: rgba(255,255,255,0.1); }
        
        table { width: 100%; margin-top: 15px; color: white; }
        td { padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.2); }
        .val { text-align: right; font-weight: bold; font-size: 1.2em; }
    </style>
</head>
<body>

<div class="header">
    <h2 style="margin:0">MÁY QUÉT VÉ THÔNG MINH</h2>
</div>

<div class="main-layout">
    <div class="card">
        <h3 style="color: var(--dark-blue); margin-top:0">📷 QUÉT THẺ CCCD</h3>
        <div id="reader"></div>
        
        <div id="passengerInfo" class="info-box">
            <h3 style="margin-top:0">HÀNH KHÁCH</h3>
            <div><strong>Họ tên:</strong> <span id="resName"></span></div>
            <div><strong>Tuổi:</strong> <span id="resAge"></span> (<span id="resType"></span>)</div>
            <div><strong>Địa chỉ:</strong> <span id="resAddress"></span></div>
            <div class="price-tag"><span id="resPrice"></span></div>
            <button class="btn btn-print" onclick="confirmTicket()">XÁC NHẬN IN VÉ</button>
            <button class="btn" style="background:#ccc" onclick="resetUI()">HỦY</button>
        </div>

        <div style="margin-top: 20px;">
            <h4>BÁN VÉ THỦ CÔNG</h4>
            <button class="btn btn-manual" onclick="addManual('Vé Thường', 6000)">Vé Thường (6k)</button>
            <button class="btn btn-manual" onclick="addManual('Vé Học Sinh', 3000)">Học Sinh (3k)</button>
            <button class="btn btn-manual" onclick="addManual('Miễn Phí', 0)">Miễn Phí (0k)</button>
        </div>
    </div>

    <div class="stats-card">
        <h3>QUẢN LÝ CA TRỰC</h3>
        <p>Tiếp viên: <span id="staffName" class="editable" onclick="editInfo('staffName', 'Tên tiếp viên')">Nguyễn Văn A</span></p>
        <p>Bắt đầu: <span id="startTime" class="editable" onclick="editInfo('startTime', 'Thời gian bắt đầu')">06:00</span></p>
        <hr>
        <table>
            <tr><td>Số khách:</td><td class="val" id="totalPax">0</td></tr>
            <tr><td>Doanh thu:</td><td class="val" id="totalRev">0 đ</td></tr>
        </table>
        <button class="btn" style="background: white; color: var(--dark-blue); margin-top: 30px;" onclick="location.reload()">KẾT THÚC CA</button>
    </div>
</div>

<script>
    let stats = { pax: 0, revenue: 0 };
    let tempTicket = null;

    // 1. Khởi tạo máy quét Camera
    const html5QrCode = new Html5Qrcode("reader");
    const config = { fps: 10, qrbox: { width: 250, height: 250 } };

    html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess);

    function onScanSuccess(decodedText) {
        // Tạm dừng quét khi đã nhận diện được
        html5QrCode.pause();
        processData(decodedText);
    }

    // 2. Xử lý dữ liệu từ CCCD
    function processData(qrString) {
        // Định dạng: CCCD||Name|DOB|Sex|Address|DOF||||
        const parts = qrString.split('|');
        if (parts.length < 6) {
            alert("Mã QR không đúng định dạng CCCD!");
            html5QrCode.resume();
            return;
        }

        const name = parts[2];
        const dob = parts[3]; // DDMMYYYY
        const address = parts[5];
        const birthYear = parseInt(dob.substring(4, 8));
        const age = 2026 - birthYear;

        let type = "Vé Thường";
        let price = 6000;

        if (age >= 1 && age <= 14) { type = "Trẻ Em"; price = 0; }
        else if (age >= 15 && age <= 28) { type = "Học Sinh"; price = 3000; }
        else if (age >= 50) { type = "Người Già"; price = 0; }

        // Cập nhật UI
        document.getElementById('resName').innerText = name;
        document.getElementById('resAge').innerText = age;
        document.getElementById('resType').innerText = type;
        document.getElementById('resAddress').innerText = address;
        document.getElementById('resPrice').innerText = price.toLocaleString() + " VNĐ";
        
        tempTicket = { price: price };
        document.getElementById('passengerInfo').style.display = 'block';
    }

    // 3. Chức năng xác nhận và thống kê
    function confirmTicket() {
        if (tempTicket) {
            stats.pax++;
            stats.revenue += tempTicket.price;
            updateStats();
            alert("Đã in vé thành công!");
            resetUI();
        }
    }

    function addManual(type, price) {
        stats.pax++;
        stats.revenue += price;
        updateStats();
        alert("Đã in " + type);
    }

    function updateStats() {
        document.getElementById('totalPax').innerText = stats.pax;
        document.getElementById('totalRev').innerText = stats.revenue.toLocaleString() + " đ";
    }

    function resetUI() {
        document.getElementById('passengerInfo').style.display = 'none';
        tempTicket = null;
        html5QrCode.resume(); // Tiếp tục quét
    }

    // 4. Chỉnh sửa thông tin ca trực
    function editInfo(id, label) {
        let newVal = prompt("Nhập " + label + ":", document.getElementById(id).innerText);
        if (newVal) document.getElementById(id).innerText = newVal;
    }
</script>

</body>
</html>
